[project]
name = "gaps"
version = "0.1.0"
description = "Genetic Algorithm based solver for jigsaw puzzles with piece size auto-detection."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [
    { name = "Nemanja Milicevic", email = "the.nemanja.milicevic@gmail.com" },
]
dependencies = [
    "pillow>=12.3.0,<13.0.0",
    "numpy>=2.0.0,<3.0.0",
    "opencv-python>=4.8.0.76,<5.0.0",
    "click>=8.1.6,<9.0.0",
]

[project.urls]
Homepage = "https://github.com/nemanja-m/gaps"
Repository = "https://github.com/nemanja-m/gaps"

[project.scripts]
gaps = "gaps.cli:cli"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pyrefly>=1.0.0,<2.0.0",
    "ruff>=0.11.0,<1.0.0",
    "pytest-benchmark>=4.0.0,<5.0.0",
]

[tool.pytest.ini_options]
addopts = "-ra -v -m 'not benchmark'"
markers = [
    "benchmark: opt-in performance benchmarks",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyrefly]
project-includes = ["gaps", "tests"]
python-version = "3.12"

[build-system]
requires = ["uv_build>=0.12.15,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

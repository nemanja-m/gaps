name: gaps

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: |
          python -m pip install --disable-pip-version-check poetry==2.3.2
          python -m poetry config virtualenvs.create true
          python -m poetry config virtualenvs.in-project true

      - name: Load cached virtualenv
        uses: actions/cache@v4
        id: cache
        with:
          path: .venv
          key: >-
            venv-${{ runner.os }}-${{ matrix.python-version }}-
            ${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: python -m poetry install --no-interaction --no-root

      - name: Install library
        if: steps.cache.outputs.cache-hit != 'true'
        run: python -m poetry install --no-interaction

      - name: Run linter checks
        run: |
          python -m poetry run black gaps/ tests/ --check
          python -m poetry run mypy gaps/ tests/ --ignore-missing-imports
          python -m poetry run ruff check gaps/ tests/

      - name: Run tests
        run: python -m poetry run pytest
